<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Arrow Puzzle</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- =========================
         SPLASH SCREEN
    ========================== -->
    <section id="splash-screen" class="screen active">
      <div class="splash-content">
        <div class="game-logo">
          <div class="logo-arrow">➜</div>
          <h1>ARROW</h1>
          <h2>PUZZLE</h2>
        </div>

        <div class="loading-container">
          <div class="loading-bar">
            <div id="loading-progress"></div>
          </div>

          <p id="loading-text">Loading...</p>
        </div>
      </div>

      <div class="version">v1.0.0</div>
    </section>

    <!-- =========================
         HOME SCREEN
    ========================== -->
    <section id="home-screen" class="screen">
      <div class="home-container">
        <div class="home-logo">
          <div class="home-arrow">➜</div>

          <h1>ARROW</h1>
          <h2>PUZZLE</h2>
        </div>

        <div class="home-menu">
          <button id="play-btn" class="menu-button play-button">
            <span>▶</span>
            PLAY
          </button>

          <button class="menu-button">
            <span>⚙</span>
            SETTINGS
          </button>
        </div>

        <div class="home-footer">
          <p>Tap PLAY to start</p>
        </div>
      </div>
    </section>
    <!-- ========================= LEVEL SELECTION SCREEN ========================== -->
    <section id="level-screen" class="screen">
      <div class="level-container">
        <!-- Header -->
        <div class="level-header">
          <button id="level-back-btn" class="back-button">←</button>
          <div class="level-title"><span>SELECT LEVEL</span></div>
          <div class="header-spacer"></div>
        </div>
        <!-- Progress -->
        <div class="level-progress">
          <div class="progress-text">
            <span>YOUR PROGRESS</span>
            <span id="level-progress-text">1 / 50</span>
          </div>
          <div class="progress-track">
            <div id="level-progress-bar" class="progress-fill"></div>
          </div>
        </div>
        <!-- Levels -->
        <div id="levels-grid" class="levels-grid">
          <!-- Levels generated by JavaScript -->
        </div>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <div class="game-container">
        <!-- ========================= TOP SECTION ========================== -->
        <div class="game-top">
          <!-- Header -->
          <div class="game-header">
            <button
              id="game-back-btn"
              class="game-icon-button"
              aria-label="Back"
            >
              ←
            </button>
            <div class="current-level">
              LEVEL <span id="current-level-number">1</span>
            </div>
            <button
              id="game-settings-btn"
              class="game-icon-button"
              aria-label="Settings"
            >
              ⚙
            </button>
          </div>
          <!-- Game Information -->
          <div class="game-info">
            <!-- Complexity -->
            <div class="complexity-info">
              <span class="info-label"> COMPLEXITY </span>
              <div id="level-complexity" class="complexity-stars">★★★</div>
            </div>
            <!-- Arrow Counter -->
            <div class="arrow-counter">
              <span id="arrow-count" class="arrow-count-number"> 0 </span>
              <span class="info-label"> ARROWS </span>
            </div>
            <!-- Lives -->
            <div class="lives-info">
              <span class="info-label"> LIVES </span>
              <div id="lives-container" class="lives-container">
                <span class="heart active">♥</span>
                <span class="heart active">♥</span>
                <span class="heart active">♥</span>
              </div>
            </div>
          </div>
        </div>
        <!-- ========================= PUZZLE AREA ========================== -->
        <div id="puzzle-area" class="puzzle-area">
          <div id="puzzle-board" class="puzzle-board"></div>
        </div>
        <!-- ========================= BOTTOM SECTION ========================== -->
        <div class="game-bottom">
          <button id="hint-btn" class="bottom-game-button" aria-label="Hint">
            <span class="bottom-icon"> 💡 </span>
            <span class="bottom-label"> HINT </span>
          </button>
          <button
            id="level-select-btn"
            class="bottom-game-button"
            aria-label="Level Selection"
          >
            <span class="bottom-icon"> ☰ </span>
            <span class="bottom-label"> LEVELS </span>
          </button>
        </div>

        <div
          id="game-over-overlay"
          class="game-over-overlay"
          aria-hidden="true"
        >
          <div class="game-over-card">
            <p class="game-over-kicker">OUT OF LIVES</p>
            <h2>GAME OVER</h2>
            <p class="game-over-text">
              A blocked arrow costs a heart. Try this level again.
            </p>
            <button id="game-over-retry-btn" class="menu-button play-button">
              RETRY
            </button>
            <button id="game-over-levels-btn" class="menu-button">
              LEVELS
            </button>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
