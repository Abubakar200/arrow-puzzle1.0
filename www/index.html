<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Arrow Puzzle</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         SPLASH SCREEN
    ========================== -->
    <section id="splash-screen" class="screen active">

        <div class="splash-content">

            <div class="game-logo">
                <div class="logo-arrow">➜</div>
                <h1>ARROW</h1>
                <h2>PUZZLE</h2>
            </div>

            <div class="loading-container">

                <div class="loading-bar">
                    <div id="loading-progress"></div>
                </div>

                <p id="loading-text">Loading...</p>

            </div>

        </div>

        <div class="version">
            v1.0.0
        </div>

    </section>


    <!-- =========================
         HOME SCREEN
    ========================== -->
    <section id="home-screen" class="screen">

        <div class="home-container">

            <div class="home-logo">
                <div class="home-arrow">➜</div>

                <h1>ARROW</h1>
                <h2>PUZZLE</h2>
            </div>

            <div class="home-menu">

                <button id="play-btn" class="menu-button play-button">
                    <span>▶</span>
                    PLAY
                </button>

                <button class="menu-button">
                    <span>⚙</span>
                    SETTINGS
                </button>

            </div>

            <div class="home-footer">
                <p>Tap PLAY to start</p>
            </div>

        </div>

    </section>
    <!-- ========================= LEVEL SELECTION SCREEN ========================== -->
    <section id="level-screen" class="screen">
        <div class="level-container"> <!-- Header -->
            <div class="level-header"> <button id="level-back-btn" class="back-button"> ← </button>
                <div class="level-title"> <span>SELECT LEVEL</span> </div>
                <div class="header-spacer"></div>
            </div> <!-- Progress -->
            <div class="level-progress">
                <div class="progress-text"> <span>YOUR PROGRESS</span> <span id="level-progress-text">1 / 50</span>
                </div>
                <div class="progress-track">
                    <div id="level-progress-bar" class="progress-fill"></div>
                </div>
            </div> <!-- Levels -->
            <div id="levels-grid" class="levels-grid"> <!-- Levels generated by JavaScript --> </div>
        </div>
    </section>

    <script src="js/levels.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
